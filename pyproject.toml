[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-virtualqueue"
version = "0.1.0.post3"
description = "Independent clinical waiting and hospital arrival coordination service"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-NHS-VirtualQueue-Commercial AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
authors = [{name = "A Haque (zaid)"}]
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.6",
  "alembic==1.20.1", "psycopg[binary]==3.3.6", "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1", "cryptography==50.0.2", "pydantic==2.14.1"
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.3", "playwright==1.64.1", "pip-audit==2.10.1"]

[project.scripts]
virtualqueue = "virtualqueue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
virtualqueue = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
