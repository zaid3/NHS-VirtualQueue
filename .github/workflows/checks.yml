name: Build and clinical workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install -e '.[test]'
      - run: ruff check .
      - run: pytest --cov=virtualqueue --cov-report=term-missing --cov-fail-under=80
      - run: pip-audit -r requirements.lock
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: docker build -t virtualqueue:ci .
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: virtualqueue_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: virtualqueue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U virtualqueue_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://virtualqueue_test:disposable-ci-password@localhost:5432/virtualqueue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install -e '.[test]'
      - run: pytest
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-screenshots
          path: artifacts/*.png
